{% extends "base.html" %}
{% block conteudo %}
<header class="cabecalho-pagina">
  <div><h1 class="titulo-pagina">Editar sugestão</h1><p class="descricao">{{ sugestao.titulo }}</p></div>
  <div class="acoes-pagina"><a class="btn btn-outline-secondary" href="{{ url_for('main.index') }}#sugestoes">Voltar às sugestões</a></div>
</header>
<section class="card"><div class="card-body">
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="grade-form">
      <div class="mb-3 campo-inteiro"><label class="form-label" for="titulo">Título</label><input id="titulo" name="titulo" class="form-control" value="{{ request.form.get('titulo', sugestao.titulo) }}" required></div>
      <div class="mb-3"><label class="form-label" for="autor">Autor</label><input id="autor" name="autor" class="form-control" value="{{ request.form.get('autor', sugestao.autor) }}" required></div>
      <div class="mb-3"><label class="form-label" for="isbn">ISBN (opcional)</label><input id="isbn" name="isbn" class="form-control" value="{{ request.form.get('isbn', sugestao.isbn or '') }}"></div>
      <div class="mb-3 campo-inteiro"><label class="form-label" for="sugerido_por">Sugerido por (opcional)</label><input id="sugerido_por" name="sugerido_por" class="form-control" value="{{ request.form.get('sugerido_por', sugestao.sugerido_por or '') }}"></div>
      <div class="mb-3 campo-inteiro"><label class="form-label" for="motivo">Por que esse livro? (opcional)</label><input id="motivo" name="motivo" class="form-control" value="{{ request.form.get('motivo', sugestao.motivo or '') }}"></div>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <button class="btn btn-primary" type="submit">Salvar alterações</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('main.index') }}#sugestoes">Cancelar</a>
    </div>
  </form>
</div></section>
{% endblock %}
