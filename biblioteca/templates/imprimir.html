{% extends "base.html" %}
{% block conteudo %}
<header class="cabecalho-pagina">
  <div><h1 class="titulo-pagina">{{ titulo }}</h1><p class="descricao">{{ nome_biblioteca }}, em {{ hoje | data_br }}</p></div>
  <div class="acoes-pagina d-print-none">
    <button class="btn btn-primary" onclick="window.print()">Imprimir</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('main.index') }}">Voltar</a>
  </div>
</header>
<div class="tabela-caixa"><div class="table-responsive"><table class="table mb-0">
  <thead><tr>{% for c in cabecalho %}<th>{{ c }}</th>{% endfor %}</tr></thead>
  <tbody>
    {% for linha in linhas %}<tr>{% for v in linha %}<td>{{ v }}</td>{% endfor %}</tr>
    {% else %}<tr><td colspan="{{ cabecalho | length }}" class="vazio">Nenhum registro.</td></tr>{% endfor %}
  </tbody>
</table></div></div>
{% endblock %}
